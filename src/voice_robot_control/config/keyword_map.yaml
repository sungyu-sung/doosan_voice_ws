# keyword_map.yaml — 어떤 말을 어떤 명령으로 볼지 적어두는 파일
#
# ⑦ nlp_node 가 이 파일을 읽습니다.
# 여기에 낱말을 추가하면 **다시 빌드하지 않아도** 됩니다.
# 고친 뒤 nlp_node 를 Ctrl+C 로 끄고 다시 켜기만 하면 반영됩니다.
#
# ■ 우리 팀 명령어 만들기
#   아래 목록에 하고 싶은 말을 한 줄씩 추가하세요.
#   띄어쓰기는 무시되므로 "기 어" 처럼 띄어 써도 됩니다.


# ══════════════════════════════════════════════════════════
#  1) 명령  —  로봇이 무엇을 할지
# ══════════════════════════════════════════════════════════
commands:

  home:            # 홈 자세로 돌아가기
    - 홈으로
    - 홈자세
    - 처음
    - 초기화
    - 복귀
    - 돌아가

  pick:            # 집기만
    - 집어
    - 집어줘
    - 잡아
    - 잡아줘
    - 들어

  place:           # 놓기만
    - 놓아
    - 놓아줘
    - 내려놔
    - 내려놔줘
    - 플레이스

  pickplace:       # 집어서 옮기기 (집기 + 놓기)
    - 조립
    - 조립해
    - 조립해줘
    - 옮겨
    - 옮겨줘
    - 가져다놔
    - 픽앤플레이스
    - 시작

  open:            # 그리퍼 열기
    - 열어
    - 열어줘
    - 오픈
    - 그리퍼열어

  close:           # 그리퍼 닫기
    - 닫아
    - 닫아줘
    - 클로즈
    - 그리퍼닫아

  stop:            # 멈추기
    - 정지
    - 멈춰
    - 멈춰줘
    - 스톱
    - 그만
    - 중지



# ── 우리 팀이 만든 동작 ───────────────────────────────────
#  my_actions.yaml 에 만든 동작에도 이렇게 낱말을 붙입니다.
#  **이름이 my_actions.yaml 의 이름과 똑같아야** 합니다.

  인사:
    - 인사해
    - 안녕

  집게운동:
    - 집게운동
    - 운동해

  둘만옮기기:
    - 두개만옮겨
    - 두개만


# ══════════════════════════════════════════════════════════
#  2) 방향  —  그쪽으로 조금 움직이기
#
#  ※ 명령이 먼저입니다. "위로 조립해" 처럼 둘 다 들어 있으면
#     명령(조립)으로 봅니다. 방향만 있을 때만 방향 이동이 됩니다.
# ══════════════════════════════════════════════════════════
directions:

  forward:         # 앞 (+x)
    - 앞으로
    - 앞
    - 전진

  backward:        # 뒤 (-x)
    - 뒤로
    - 뒤
    - 후진

  left:            # 왼쪽 (+y)
    - 왼쪽으로
    - 왼쪽
    - 왼

  right:           # 오른쪽 (-y)
    - 오른쪽으로
    - 오른쪽
    - 오른

  up:              # 위 (+z)
    - 위로
    - 위

  down:            # 아래 (-z)
    - 아래로
    - 아래
    - 밑으로


# ══════════════════════════════════════════════════════════
#  3) 번호  —  몇 번 기어인지
# ══════════════════════════════════════════════════════════
numbers:

  1: [1번, 일번, 첫번째, 하나]
  2: [2번, 이번, 두번째, 둘]
  3: [3번, 삼번, 세번째, 셋]
  4: [4번, 사번, 네번째, 넷]


# ══════════════════════════════════════════════════════════
#  4) 전체  —  번호 대신 "다 해줘" 라고 할 때
# ══════════════════════════════════════════════════════════
all_words:
  - 전체
  - 전부
  - 모두

# ※ "다" 처럼 한 글자만 넣으면 안 됩니다.
#    "가져다놔" 안에도 "다" 가 들어 있어서, 1번만 시켜도 4개를 다 해버립니다.
#    낱말은 두 글자 이상으로 만드세요. 노드를 켜면 자동으로 잡아 줍니다.


# ══════════════════════════════════════════════════════════
#  ▼▼▼ 우리 팀 명령어는 여기에 추가하세요 ▼▼▼
#
#  위의 목록에 그냥 한 줄 끼워 넣어도 되고, 아래 예시처럼
#  해당 항목 밑에 적어도 됩니다. (같은 낱말을 두 번 적지는 마세요)
#
#  commands:
#    pickplace:
#      - 출발
#      - 시작해줘
#    home:
#      - 집에가
#
#  고친 뒤에는
#    1) 잘 됐는지 미리 보기 (로봇도 ROS도 필요 없음)
#         python3 ~/doosan_voice_ws/src/voice_robot_control/voice_robot_control/nlp_node.py "출발"
#    2) nlp_node 를 Ctrl+C 로 끄고 다시 켜기
#  ══════════════════════════════════════════════════════════
